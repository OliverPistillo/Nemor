name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-2:
    name: Phase 2 validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Build all targets
        run: cargo build --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Read real Linux telemetry interfaces
        run: cargo test -p collector system::tests::production_collectors_read_real_linux_interfaces --all-features

      - name: Classify real Linux process telemetry read-only
        run: cargo test -p classifier tests::real_linux_process_identity_can_be_classified_read_only --all-features
