name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    name: Build, test and Linux validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Build all targets
        run: cargo build --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Read real Nemor Linux telemetry interfaces
        run: cargo test -p nemor-collector system::tests::production_collectors_read_real_linux_interfaces --all-features

      - name: Classify real Nemor Linux process telemetry read-only
        run: cargo test -p nemor-classifier tests::real_linux_process_identity_can_be_classified_read_only --all-features

      - name: Inspect real Nemor Linux zram interfaces read-only
        run: cargo test -p nemor-zram tests::linux_backend_inspects_real_host_read_only --all-features

      - name: Inspect real Linux tiering interfaces read-only
        run: cargo run -p nemorctl -- --config config/default.toml tiering status --json

      - name: Run privileged validation harness read-only preflight
        run: cargo run -p nemor-test-support --bin nemor-privileged-validation -- --preflight

      - name: Benchmark framework read-only preflight
        run: cargo run -p nemor-benchmark -- preflight --json

      - name: Tiny non-pressure benchmark instrumentation smoke
        run: cargo run -p nemor-benchmark -- smoke --scenario synthetic_compressible --bytes 1048576 --seed 1 --database /tmp/nemor-benchmark-ci.sqlite --report-dir /tmp/nemor-benchmark-ci-reports
