[package]
name = "nemord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
actuator = { package = "nemor-actuator", path = "../actuator" }
anyhow.workspace = true
clap.workspace = true
collector = { package = "nemor-collector", path = "../collector" }
classifier = { package = "nemor-classifier", path = "../classifier" }
common = { package = "nemor-common", path = "../common" }
damon = { package = "nemor-damon", path = "../damon" }
damos = { package = "nemor-damos", path = "../damos" }
policy-engine = { package = "nemor-policy-engine", path = "../policy-engine" }
storage = { package = "nemor-storage", path = "../storage" }
tiering = { package = "nemor-tiering", path = "../tiering" }
zram = { package = "nemor-zram", path = "../zram" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
nemorctl = { path = "../nemorctl" }
serde_json.workspace = true
test-support = { package = "nemor-test-support", path = "../test-support" }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["process", "signal"] }

[lints]
workspace = true
