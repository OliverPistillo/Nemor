[general]
mode = "observe"
sample_interval_ms = 1000
database_path = "/var/lib/nemor/nemor.db"
allow_automatic_actions = false

[cgroups]
enabled = false
dry_run = true
allow_move = false
rollback_on_exit = true
recover_unclean_session = true
foreground_min_percent = 5
foreground_max_percent = 40
background_high_min_percent = 20
background_high_max_percent = 80
minimum_headroom_percent = 10
allowed_identities = []

[telemetry]
process_sample_interval_ms = 5000
smaps_rollup_interval_ms = 60000
smaps_rollup_budget = 32
retention_days = 7
retention_interval_ms = 3600000
sqlite_batch_size = 512

[classification]
interval_ms = 5000
minimum_confidence = 0.65
confirmation_samples = 3
browser_heavy_process_count = 8
browser_heavy_memory_percent = 15.0
virtualization_memory_percent = 10.0
gaming_background_memory_percent = 20.0
protected_executables = []
critical_executables = []
game_executables = []

[safety]
max_cpu_overhead_percent = 5.0
max_io_write_mib_per_second = 100
rollback_on_daemon_exit = true
rollback_on_error = true
protect_foreground = true

[pressure]
watch_available_percent = 20
pressure_available_percent = 12
critical_available_percent = 7
emergency_available_percent = 3
psi_some_avg10_threshold = 10.0
psi_full_avg10_threshold = 2.0
emergency_psi_full_avg10_threshold = 10.0
major_fault_rate_threshold = 100.0
swap_in_rate_threshold = 128.0
swap_out_rate_threshold = 128.0
state_hold_seconds = 10
recovery_hold_seconds = 30

[policy]
enabled = true
evaluation_interval_ms = 5000
decision_heartbeat_seconds = 300

[compression]
backend = "detect"
preferred_low_latency = "lz4"
preferred_capacity = "zstd"
enabled = true
active_profile = "safe"
dry_run = true
allow_runtime_reconfigure = false
allow_persistent_reconfigure = false
max_zram_percent_ram = 100
safe_headroom_percent = 15
benchmark_enabled = false
benchmark_max_bytes = 67108864
max_cpu_overhead_percent = 2.0
min_capacity_gain_percent = 10.0

[ksm]
enabled = false
profiles = ["virtualization", "browser_heavy"]

[damon]
enabled = false
mode = "monitor_only"
max_action_time_ms = 5
max_action_bytes = 268435456

[gaming]
auto_detect = true
protect_gamescope = true
protect_steam = true
background_reclaim = true
